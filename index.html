<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Where is Matt?</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
  --accent:#111827;--green:#16a34a;--blue:#2563eb;--orange:#ea580c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:24px 18px 28px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0002}
.wrap{max-width:720px;margin:auto}
h1{font-size:28px;margin:0 0 4px}
.subtitle{color:#cbd5e1;font-size:14px}
.hero{background:var(--card);margin:16px 0;padding:20px;border-radius:20px;box-shadow:0 4px 18px #0000000b}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.location{font-size:32px;font-weight:800;margin:4px 0}
.activity{font-size:18px;margin-top:4px}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.clock{background:#f3f4f6;border-radius:14px;padding:12px}
.clock strong{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.clock span{font-size:12px;color:var(--muted)}
.next{margin-top:14px;padding:12px 14px;border-left:4px solid var(--blue);background:#eff6ff;border-radius:10px}
.controls{display:flex;gap:8px;align-items:center;margin:16px 0}
button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
button:hover{background:#f9fafb}
#month{font-weight:800;margin-left:auto;margin-right:auto}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.day.today{border:2px solid var(--accent)}
.dayhead{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.datebox{min-width:48px;text-align:center}
.datebox b{display:block;font-size:22px;line-height:22px}
.datebox span{font-size:11px;color:var(--muted);text-transform:uppercase}
.dayinfo{flex:1}
.daycity{font-weight:800}
.dayact{font-size:13px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#f3f4f6}
.badge.show{background:#dcfce7;color:#166534}
.badge.travel{background:#dbeafe;color:#1d4ed8}
.badge.off{background:#f3f4f6;color:#4b5563}
.details{display:none;border-top:1px solid var(--line);padding:12px 15px;background:#fafafa}
.day.open .details{display:block}
.timeline{display:grid;gap:8px}
.row{display:flex;gap:12px}
.dot{width:8px;height:8px;background:#9ca3af;border-radius:50%;margin-top:6px;flex:none}
.rowtext{font-size:14px}
.small{font-size:12px;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:480px){.location{font-size:28px}.clocks{grid-template-columns:1fr 1fr}}

.love{font-size:13px;font-weight:800;color:#db2777;margin-bottom:7px}
.venueHero{display:none;margin-top:12px;padding:10px 12px;background:#fff1f2;border-radius:12px;color:#9f1239;font-size:13px}
.venueHero a{color:inherit;text-decoration:none;font-weight:800}
.tripcard{background:linear-gradient(135deg,#fff1f2,#fdf2f8);border:1px solid #fbcfe8;border-radius:18px;padding:14px 16px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.tripcard span{font-size:22px;margin-right:8px}.tripcard b{font-size:14px;display:block}.tripcard small{display:block;color:#9f1239;margin-top:2px}.heart{font-size:27px;color:#ec4899}
.day.show{border-left:4px solid #ec4899}
.day.travel{border-left:4px solid #60a5fa}
.day.off{border-left:4px solid #d1d5db}
.venueCard{margin-top:10px;padding:11px 12px;background:white;border:1px solid #f1f5f9;border-radius:12px}
.venueCard b{font-size:13px}.venueCard small{display:block;color:var(--muted);margin-top:2px}
.maplink{display:inline-block;margin-top:7px;font-size:12px;color:#2563eb;text-decoration:none;font-weight:800}

.flightHero{display:none;margin-top:12px}
.flight{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-top:8px}
.flighttop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.flightno{font-weight:900;font-size:14px}
.flightroute{font-size:13px;font-weight:700;margin-top:4px}
.flighttimes{font-size:12px;color:var(--muted);margin-top:3px}
.track{display:inline-block;margin-top:8px;color:#2563eb;text-decoration:none;font-size:12px;font-weight:900}
</style>
</head>

function dateObj(s){ return new Date(s+"T12:00:00Z"); }
function fmtDate(d, opts={}) {
  return new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long",year:"numeric",...opts}).format(d);
}
function nowIn(tzName) {
  return new Intl.DateTimeFormat("en-GB",{timeZone:tzName,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
}
function todayKey(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:homeTz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const o={};p.forEach(x=>o[x.type]=x.value); return `${o.year}-${o.month}-${o.day}`;
}
function prettyDate(s){
  return new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",weekday:"short",day:"numeric",month:"short"}).format(dateObj(s));
}
function typeLabel(t){return t==="show"?"WORK":t==="travel"?"TRAVEL":t==="off"?"OFF":"PREP"}

  const key=todayKey();

    document.getElementById("heroActivity").textContent="No more scheduled days.";

    document.getElementById("heroDate").textContent = item ? `Today · ${prettyDate(key)}` : `Next up · ${prettyDate(target[0])}`;
    document.getElementById("heroLocation").textContent = target[2]==="Travel" ? "✈️ Travelling" : target[2];
    document.getElementById("heroActivity").textContent = target[1];

      vh.style.display="block";
      vh.innerHTML=`${venue.icon} <a href="${venue.map}" target="_blank" rel="noopener">${venue.name}</a> · ${venue.desc}`;
    } else vh.style.display="none";

    document.getElementById("localClock").textContent = tz[target[2]] ? nowIn(tz[target[2]]) : "—";
    document.getElementById("localLabel").textContent = tz[target[2]] ? `Local time · ${target[2]} · ${zoneNames[tz[target[2]]] || tz[target[2]]}` : "Time zone unavailable";
  }

  const zoneNames={
  "America/Chicago":"Central Time (CT)",
  "America/New_York":"Eastern Time (ET)",
  "America/Toronto":"Eastern Time (ET)",
  "America/Los_Angeles":"Pacific Time (PT)",
  "America/Phoenix":"Arizona Time (MST)"

      <div class="flightroute">${f.from} → ${f.to}</div>
      <div class="flighttimes">${f.dep} departure · ${f.arr} arrival</div>
      <a class="track" href="${f.tracker}" target="_blank" rel="noopener">Track this flight →</a>
    </div>`).join("");
  } else {
    fh.style.display="none";
    fh.innerHTML="";
  }

  const idx=schedule.findIndex(x=>x[0]===key);
  const next=idx>=0 ? schedule[idx+1] : schedule.find(x=>x[0]>key);

    : "No more scheduled days. ❤️";

  const first=new Date("2026-08-28T00:00:00Z"), last=new Date("2026-10-25T12:00:00"), now=new Date();
  const pct=Math.max(0,Math.min(100,((now-first)/(last-first))*100));
  document.getElementById("tripProgress").textContent =
    now<first ? "Starts 28 August" : now>last ? "Back home" : `${Math.round(pct)}% of the trip`;
}
function renderDays(){
  const container=document.getElementById("days");
  container.innerHTML="";
  document.getElementById("month").textContent=view.toLocaleString("en-GB",{month:"long",year:"numeric"});
  const ym=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,"0")}`;
  const today=todayKey();
  schedule.filter(x=>x[0].startsWith(ym)).forEach(x=>{
    const [date,notes,city,type]=x;
    const d=dateObj(date);
    const venue=venues[notes];
    const div=document.createElement("div");
    div.className="day "+type+(date===today?" today":"");
    div.innerHTML=`
      <div class="dayhead">
        <div class="datebox"><b>${d.getUTCDate()}</b><span>${d.toLocaleDateString("en-GB",{weekday:"short",timeZone:"UTC"})}</span></div>
        <div class="dayinfo"><div class="daycity">${city==="Travel"?"✈️ Travel":city}</div><div class="dayact">${notes}</div></div>
        <div class="badge ${type}">${typeLabel(type)}</div>
      </div>
      <div class="details">
        <div class="timeline">
          <div class="row"><div class="dot"></div><div class="rowtext"><b>📍 Location</b><br>${city}</div></div>
          ${venue ? `<div class="venueCard">${venue.icon} <b>${venue.name}</b><small>${venue.desc}</small><a class="maplink" href="${venue.map}" target="_blank" rel="noopener">Open in Maps →</a></div>` : ""}
          <div class="row"><div class="dot"></div><div class="rowtext"><b>🕐 Local time now</b><br><span class="small" data-clock="${tz[city] ? city : ""}">${tz[city] ? nowIn(tz[city]) : "—"}</span></div></div>
          <div class="row"><div class="dot"></div><div class="rowtext"><b>💗 Matt's plan</b><br>${notes}</div></div>
          ${flights[date] ? flights[date].map(f=>`<div class="flight">
            <div class="flighttop"><span class="flightno">✈️ ${f.no}</span><span class="small">Delta</span></div>
            <div class="flightroute">${f.from} → ${f.to}</div>
            <div class="flighttimes">${f.dep} departure · ${f.arr} arrival</div>
            <a class="track" href="${f.tracker}" target="_blank" rel="noopener">Track flight →</a>
          </div>`).join("") : ""}
        </div>
      </div>`;
    div.querySelector(".dayhead").onclick=()=>div.classList.toggle("open");
    container.appendChild(div);
  });
  if(!container.children.length) container.innerHTML='<div class="hero">Nothing scheduled in this month.</div>';
}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderDays()}
function tick(){
  renderHero();
  document.querySelectorAll("[data-clock]").forEach(el=>el.textContent=nowIn(tz[el.dataset.clock]));
}
renderDays(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
